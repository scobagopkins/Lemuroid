name: Build Custom Lemuroid

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download Gearcoleco, MAME 2003-Plus (latest) and MAME 2010 cores (arm64-v8a)
        run: |
          mkdir -p lemuroid-cores/bundled-cores/src/main/jniLibs/arm64-v8a

          # Gearcoleco (ColecoVision)
          wget -q "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/gearcoleco_libretro_android.so.zip" -O "/tmp/gearcoleco.zip"
          unzip -q -o "/tmp/gearcoleco.zip" -d "/tmp/gearcoleco/"
          mv "/tmp/gearcoleco/gearcoleco_libretro_android.so" "lemuroid-cores/bundled-cores/src/main/jniLibs/arm64-v8a/libgearcoleco_libretro_android.so"

          # MAME 2010 (Sony ZN-1/ZN-2 sfex, sfex2p)
          wget -q "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mame2010_libretro_android.so.zip" -O "/tmp/mame2010.zip"
          unzip -q -o "/tmp/mame2010.zip" -d "/tmp/mame2010/"
          mv "/tmp/mame2010/mame2010_libretro_android.so" "lemuroid-cores/bundled-cores/src/main/jniLibs/arm64-v8a/libmame2010_libretro_android.so"

          # Update bundled MAME 2003-Plus to latest buildbot (has mips_dynarec & ZN-1/ZN-2 fixes)
          wget -q "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mame2003_plus_libretro_android.so.zip" -O "/tmp/mame2003_plus.zip"
          unzip -q -o "/tmp/mame2003_plus.zip" -d "/tmp/mame2003_plus/"
          mv "/tmp/mame2003_plus/mame2003_plus_libretro_android.so" "lemuroid-cores/lemuroid_core_mame2003_plus/src/main/jniLibs/arm64-v8a/libmame2003_plus_libretro_android.so"

          ls -lh lemuroid-cores/bundled-cores/src/main/jniLibs/arm64-v8a/lib*

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (Free Bundle Release)
        run: ./gradlew assembleFreeBundleRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Rename and Verify APK
        run: |
          mkdir -p dist
          cp lemuroid-app/build/outputs/apk/freeBundle/release/*.apk dist/Lemuroid-custom-zn-coleco.apk
          ls -lh dist/
          BUILD_TOOLS=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose dist/Lemuroid-custom-zn-coleco.apk
          "$BUILD_TOOLS/aapt2" dump badging dist/Lemuroid-custom-zn-coleco.apk | head -n 5

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lemuroid-custom-zn-coleco
          path: dist/Lemuroid-custom-zn-coleco.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-v4
          name: "Lemuroid Custom (arm64-v8a, Sony ZN-1/ZN-2 & ColecoVision, v4)"
          body: |
            Custom build of Lemuroid (v4, arm64-v8a):
            - Unique applicationId (com.swordfish.lemuroid.custom) & bumped versionCode (253)
            - Verified with apksigner
            - Updated MAME 2003-Plus (latest buildbot, mips_dynarec disabled) + MAME 2010 core
            - Pre-cached ZN-1/ZN-2 companion BIOS/parent ROMs
            - Gearcoleco + .zip extraction to .col + embedded OS-7 BIOS
          files: dist/Lemuroid-custom-zn-coleco.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
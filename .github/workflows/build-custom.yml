name: Build Custom Lemuroid

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download Gearcoleco core (ColecoVision)
        run: |
          mkdir -p lemuroid-cores/bundled-cores/src/main/jniLibs/arm64-v8a
          mkdir -p lemuroid-cores/bundled-cores/src/main/jniLibs/armeabi-v7a
          
          # arm64-v8a
          wget -q https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/gearcoleco_libretro_android.so.zip -O /tmp/gearcoleco_arm64.zip
          unzip -q -o /tmp/gearcoleco_arm64.zip -d /tmp/gearcoleco_arm64/
          mv /tmp/gearcoleco_arm64/gearcoleco_libretro_android.so lemuroid-cores/bundled-cores/src/main/jniLibs/arm64-v8a/libgearcoleco_libretro_android.so
          
          # armeabi-v7a
          wget -q https://buildbot.libretro.com/nightly/android/latest/armeabi-v7a/gearcoleco_libretro_android.so.zip -O /tmp/gearcoleco_armv7.zip
          unzip -q -o /tmp/gearcoleco_armv7.zip -d /tmp/gearcoleco_armv7/
          mv /tmp/gearcoleco_armv7/gearcoleco_libretro_android.so lemuroid-cores/bundled-cores/src/main/jniLibs/armeabi-v7a/libgearcoleco_libretro_android.so
          
          ls -lh lemuroid-cores/bundled-cores/src/main/jniLibs/arm64-v8a/lib*

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (Free Bundle Release)
        run: ./gradlew assembleFreeBundleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp lemuroid-app/build/outputs/apk/freeBundle/release/*.apk dist/Lemuroid-custom-zn-coleco.apk
          ls -lh dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lemuroid-custom-zn-coleco
          path: dist/Lemuroid-custom-zn-coleco.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-build
          name: "Lemuroid with Sony ZN-1 & ColecoVision support"
          body: |
            Custom build of Lemuroid:
            - Built-in MAME 2003-Plus for Sony ZN-1/ZN-2 arcade 3D games (Street Fighter EX, Star Gladiator, Rival Schools)
            - Built-in Gearcoleco core for ColecoVision (.col cartridges)
            - Bundled offline cores (no Google Play dynamic downloads needed)
          files: dist/Lemuroid-custom-zn-coleco.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

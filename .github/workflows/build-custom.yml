name: Build Custom Lemuroid

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache release keystore (consistent signing across versions)
        uses: actions/cache@v4
        with:
          path: release.jks
          key: lemuroid-custom-keystore-v1

      - name: Generate release keystore if missing
        run: |
          if [ ! -f release.jks ]; then
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias lemuroid \
              -storepass lemuroid \
              -keypass lemuroid \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Lemuroid Custom, O=Lemuroid, C=US"
          fi

      - name: Download Gearcoleco, MAME 2003-Plus (latest) and MAME 2010 cores (arm64-v8a)
        run: |
          mkdir -p lemuroid-cores/bundled-cores/src/main/jniLibs/arm64-v8a

          # Gearcoleco (ColecoVision)
          wget -q "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/gearcoleco_libretro_android.so.zip" -O "/tmp/gearcoleco.zip"
          unzip -q -o "/tmp/gearcoleco.zip" -d "/tmp/gearcoleco/"
          mv "/tmp/gearcoleco/gearcoleco_libretro_android.so" "lemuroid-cores/bundled-cores/src/main/jniLibs/arm64-v8a/libgearcoleco_libretro_android.so"

          # MAME 2003 (Sony ZN-1/ZN-2 MAME 0.78 ROMsets)
          wget -q "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mame2003_libretro_android.so.zip" -O "/tmp/mame2003.zip"
          unzip -q -o "/tmp/mame2003.zip" -d "/tmp/mame2003/"
          mv "/tmp/mame2003/mame2003_libretro_android.so" "lemuroid-cores/bundled-cores/src/main/jniLibs/arm64-v8a/libmame2003_libretro_android.so"

          # Update bundled MAME 2003-Plus to latest buildbot (has mips_dynarec & ZN-1/ZN-2 fixes)
          wget -q "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/mame2003_plus_libretro_android.so.zip" -O "/tmp/mame2003_plus.zip"
          unzip -q -o "/tmp/mame2003_plus.zip" -d "/tmp/mame2003_plus/"
          mv "/tmp/mame2003_plus/mame2003_plus_libretro_android.so" "lemuroid-cores/lemuroid_core_mame2003_plus/src/main/jniLibs/arm64-v8a/libmame2003_plus_libretro_android.so"

          ls -lh lemuroid-cores/bundled-cores/src/main/jniLibs/arm64-v8a/lib*

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (Free Bundle Release)
        run: ./gradlew assembleFreeBundleRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Rename, Sign (v1+v2+v3) and Verify APK
        run: |
          mkdir -p dist
          cp lemuroid-app/build/outputs/apk/freeBundle/release/*.apk dist/Lemuroid-custom-v11.apk
          BUILD_TOOLS=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-key-alias lemuroid \
            --ks-pass pass:lemuroid \
            --key-pass pass:lemuroid \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            dist/Lemuroid-custom-v11.apk
          "$BUILD_TOOLS/apksigner" verify --verbose dist/Lemuroid-custom-v11.apk
          ls -lh dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lemuroid-custom-zn-coleco
          path: dist/Lemuroid-custom-v11.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-v11
          name: "Lemuroid Custom v11 (arm64-v8a, .7z Archive Support + PSOne SF + Coleco)"
          body: |
            Custom build of Lemuroid (v11, arm64-v8a, com.swordfish.lemuroid.zn, versionCode 259):
            - Updates cleanly over custom-v8/v9/v10 (same release keystore & applicationId)
            - Full .7z archive scanning, CRC32/Serial detection, and cached extraction via 7-Zip-JBinding-4Android (LZMA/LZMA2/solid/PPMd/BCJ2)
            - Seekable zero-copy SAF ParcelFileDescriptor/FileChannel reader (with stream fallback)
            - Supports single ROMs (.nes/.sfc/.md/.gba/.n64/.iso/.pbp/.col etc.), CUE+BIN sets, and Arcade (.7z -> .zip repack for MAME 2003-Plus & FBNeo)
            - Keeps all v10 PSOne SF layout, SN30 Pro, ZN-1/2, Coleco keypad, and SAF fixes
          files: dist/Lemuroid-custom-v11.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}